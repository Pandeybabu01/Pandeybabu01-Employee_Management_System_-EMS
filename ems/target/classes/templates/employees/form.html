<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${formTitle}">Employee Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<div class="container">
    <div class="page-header">
        <h1 th:text="${formTitle}">Add / Edit Employee</h1>
        <a class="btn btn-secondary" th:href="@{/employees}">Cancel</a>
    </div>

    <div class="card">
        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}">
                    <div class="error-text" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}">
                    <div class="error-text" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}">
                    <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone" th:field="*{phone}" placeholder="+91 98765 43210">
                    <div class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" th:field="*{department}" placeholder="Engineering">
                    <div class="error-text" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>
                <div class="form-group">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" th:field="*{designation}" placeholder="Software Engineer">
                    <div class="error-text" th:if="${#fields.hasErrors('designation')}" th:errors="*{designation}"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="salary">Salary (annual)</label>
                    <input type="number" step="0.01" id="salary" th:field="*{salary}">
                    <div class="error-text" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>
                <div class="form-group">
                    <label for="dateOfJoining">Date of Joining</label>
                    <input type="date" id="dateOfJoining" th:field="*{dateOfJoining}">
                    <div class="error-text" th:if="${#fields.hasErrors('dateOfJoining')}" th:errors="*{dateOfJoining}"></div>
                </div>
            </div>

            <button type="submit" class="btn">Save Employee</button>
        </form>
    </div>
</div>
</body>
</html>
